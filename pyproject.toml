[project]
name = "trust-issues"
version = "0.1.0"
description = "A loan risk model that did the boring parts right."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    # serving/ imports fastapi, pydantic and uvicorn directly. Until now they
    # resolved only as TRANSITIVES of mlflow (uv.lock: fastapi:813,
    # pydantic:2989, starlette:3972, uvicorn:4183) -- installed, importable,
    # and undeclared. That is the same "declare what you import" defect commit
    # 341418f closed for the rest of this list: the day someone trims the ML
    # dependency, serving/ breaks at import time in production rather than in
    # CI. starlette is NOT declared here, because nothing in this repo imports
    # it; it is fastapi's own dependency and fastapi is responsible for it.
    #
    # Every entry below is a verified serving-time import: fastapi/pydantic/
    # uvicorn (the HTTP boundary), lightgbm (the booster), joblib (artifact
    # load), pandas (every frame), numpy (bureau.py/explain.py), scipy
    # (explain.py's scipy.special.expit), scikit-learn (IsotonicRegression,
    # plus model_io.py's module-level sklearn imports), pandera
    # (data_validation.py, reached transitively through serving/schema.py),
    # shap (explain.py's TreeExplainer). mlflow/metaflow/matplotlib/seaborn
    # are deliberately NOT here -- see the "training" dependency group below.
    #
    # Three of those four are genuinely unreachable from serving: mlflow,
    # metaflow and seaborn are absent from sys.modules after `import
    # serving.app`. matplotlib is NOT. serving reaches it transitively --
    # serving/artifacts.py imports lightgbm, and lightgbm's compat module
    # imports matplotlib on the way in. It stays out of this list anyway,
    # because lightgbm wraps that import in try/except ImportError (setting
    # MATPLOTLIB_INSTALLED = False and degrading to no plotting), so the slim
    # image TOLERATES matplotlib's absence rather than never asking for it.
    # Tolerated, not unreached. The runtime sys.modules check is what caught
    # the difference, and the difference is worth the extra sentence.
    "fastapi>=0.138.2",
    "joblib>=1.5.3",
    "lightgbm>=4.6.0",
    "numpy>=2.4.6",
    "pandas>=2.3.3",
    "pandera>=0.32.1",
    "pydantic>=2.13.4",
    "scikit-learn>=1.9.0",
    "scipy>=1.17.1",
    "shap>=0.49.1",
    "uvicorn>=0.49.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.uv]
# "training" is opt-out, not opt-in, by default: without this, a bare
# `uv sync` would prune mlflow/metaflow/matplotlib/seaborn from an existing
# environment the moment this group exists, silently breaking
# tests/test_train.py and tests/test_training_flow.py for anyone who runs
# `uv sync` out of habit rather than deliberately asking for the slim set.
# Keeping both groups default preserves "uv sync installs everything" for
# local/dev/CI-full use; the serving image is the one caller that opts OUT
# explicitly (--no-dev --no-group training), because that is the one place
# the distinction is supposed to matter.
default-groups = ["dev", "training"]

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
    "jupyter>=1.1.1",
    "mypy>=2.3.0",
    "pytest>=9.1.1",
    "ruff>=0.15.22",
]
# Training/notebook-only, verified against serving's actual import graph:
# pipelines/training_flow.py imports metaflow; src/train.py imports mlflow
# for its experiment-tracking orchestration; notebooks/analysis.ipynb imports
# matplotlib and seaborn.
#
# Not all four are absent from serving's import graph, and the honest split
# matters here. mlflow, metaflow and seaborn genuinely are: serving bottoms
# out at src/model_io.py, which does not import mlflow (see src/train.py's
# docstring), and none of the three appears in sys.modules after `import
# serving.app`. matplotlib DOES get imported on that path -- lightgbm's
# compat module imports it, and serving/artifacts.py imports lightgbm. It is
# still safe to leave out of the image, because that import is guarded
# (try/except ImportError -> MATPLOTLIB_INSTALLED = False), so lightgbm runs
# without it. So: three are never reached, one is reached and tolerated.
#
# The serving Docker image installs core dependencies only, via `uv sync
# --frozen --no-dev --no-group training --no-install-project`; local/dev/CI
# installs get this group by default (see [tool.uv] default-groups above).
training = [
    "matplotlib>=3.11.0",
    "metaflow>=2.19.35",
    "mlflow>=3.14.0",
    "seaborn>=0.13.2",
]

# ---------------------------------------------------------------------------
# ruff -- LINT ONLY. This repo deliberately does not use `ruff format`.
#
# That is a decision, not an omission, and the measurement behind it is worth
# keeping: `ruff format` would rewrite 36 of 45 files and ~2374 lines. It is
# not whitespace. It explodes hand-aligned literals one-item-per-line --
# emp_order (features.py) is written as a readable 0..10 ladder in three rows
# and comes back as eleven. `skip-magic-trailing-comma` does not rescue it
# (~2386 lines, marginally worse): this repo's compact hand-wrapping is not
# black-compatible in either direction. Trading that alignment, plus the git
# blame of 36 files, for uniformity is a bad trade in a repo whose history IS
# its documentation. If formatting is ever adopted it should be its own
# deliberate commit, touching nothing else -- not a side effect of linting.
#
# `select` is ruff's DEFAULT (E4 import placement, E7 statement style, E9
# syntax/IO errors, F pyflakes) plus I (import sorting). Two rule families
# were considered and declined:
#
#   UP (pyupgrade) -- not this round. Nothing about it is objectionable; it
#       simply has not been looked at yet, and rewriting syntax across a repo
#       is not something to bundle into the commit that introduces linting.
#
#   PL* (pylint) -- NEVER, and this one is not a deferral. It is precisely
#       the family that would come for the two deliberate constructions
#       below.
#
# Rules this repo must NOT be "fixed" by, recorded here so the exemption is a
# decision and not a later concession:
#
#   PLC0415 import-outside-top-level -- the /drift handler (app.py) imports
#       scripts.demo_drift INSIDE the function body. Hoisting it to module
#       scope puts mlflow + metaflow + pipelines into serving.app's import
#       graph, which is what the [dependency-groups] split, the Dockerfile's
#       COPY whitelist, and test_serving.py's subprocess import guard all
#       exist to prevent -- the slim image would die at boot. The comment at
#       that import says so at length.
#
#   PLR2004 magic-value-comparison / any "simplify to 0.25" suggestion --
#       SELECTED_THRESHOLD (config.py) is 0.25000000000000006, which is
#       np.arange(0.05, 0.95, 0.01)[20], the value the sweep actually chose,
#       and it is NOT equal to 0.25. The comment above it carries the proof.
#
#   Any rule that would edit a line whose own comment calls it deliberate,
#       deferred, or "not an oversight". There are 61 such self-declarations
#       across src/ serving/ pipelines/ scripts/ (grep -niE
#       "deliberat|on purpose|not an? (oversight|accident)"). They are the
#       repo's record of decisions, and a linter has no standing to overturn
#       one.
[tool.ruff]
target-version = "py311"
# Measured, not defaulted-into: of the 6,000-odd lines in src/ serving/
# pipelines/ scripts/, 442 exceed 79 chars, 49 exceed 88, and none exceeds
# 120. 88 is where this code already lives.
#
# This does NOT enable the formatter -- see the header above. E501 is not
# selected, so today this value is inert; it is kept because it records the
# measured shape of the code and would be the right number if E501 is ever
# turned on. Setting it is not an invitation to run `ruff format`.
line-length = 88

# notebooks/ is not linted. The cost is real and small: analysis.ipynb carries
# a handful of unsorted import blocks and one empty f-string that will now go
# uncaught. It is worth paying because the alternative is worse -- without this
# line the repo's lint command is `ruff check src serving pipelines scripts
# tests`, a string nobody remembers, and `ruff check .` stays permanently red.
# A lint command that never passes is a lint command nobody runs. The decision
# to skip the notebook belongs in this file, where it is visible and revocable
# in one line, not in whichever command a contributor happens to have copied.
#
# What makes it affordable: no production logic lives in the notebook. The
# modeling code moved into src/ long ago and the notebook is exploratory
# analysis over it, so nothing here is the only copy of anything.
extend-exclude = ["notebooks/"]

[tool.ruff.lint]
extend-select = ["I"]

# ---------------------------------------------------------------------------
# mypy -- type check. NOT strict.
#
# The third-party overrides below silence 35 `import-untyped` errors -- the
# un-stubbed scientific stack (pandas, sklearn, scipy, lightgbm, shap,
# pandera, metaflow). Those errors say nothing about this repo's code; they
# say those libraries ship no type information. Silencing them is what makes
# the remaining errors readable.
#
# pandas-stubs would replace the pandas entry with real types. Deliberately
# not installed this round: real stubs are strict enough to surface a fresh
# batch of errors, which is its own decision and does not belong in the
# commit that introduces type checking.
#
# namespace_packages + explicit_package_bases + mypy_path exist for ONE
# reason: scripts/ has no __init__.py, on purpose. The /drift availability
# probe (app.py) calls importlib.util.find_spec("scripts.demo_drift"), and
# the absence of __init__.py is what makes importing the parent package
# execute nothing -- the namespace-package note in test_serving.py documents
# that nuance and the subprocess import guard depends on it. So mypy is
# configured to TOLERATE the namespace package. Adding scripts/__init__.py to
# make a type checker comfortable would change runtime import behaviour to
# satisfy a tool, which is backwards.
[tool.mypy]
python_version = "3.11"
files = ["src", "serving", "pipelines", "scripts"]
namespace_packages = true
explicit_package_bases = true
mypy_path = "."

[[tool.mypy.overrides]]
module = [
    "pandas.*",
    "sklearn.*",
    "scipy.*",
    "lightgbm.*",
    "shap.*",
    "pandera.*",
    "metaflow.*",
    "joblib.*",
]
ignore_missing_imports = true
