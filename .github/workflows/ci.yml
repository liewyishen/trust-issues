# CI -- ruff, mypy, the test suite, and the frontend build. Python 3.11, Node 24.
#
# This file used to say frontend/ was not checked here, and that it was a
# deferral rather than an oversight. The deferral is now partly redeemed: a
# fourth job builds frontend/, which type checks it (`tsc -b`) and bundles it
# (`vite build`) in one command.
#
# What is still not checked there is lint, and the shape of that gap is worth
# naming rather than leaving as a blank. frontend/ is not lint-free by
# omission: oxlint is in its devDependencies, .oxlintrc.json configures it with
# three plugins and two rules, and it exits 0 today. It is simply wired to
# nothing -- no npm script calls it, and so neither can this file. Installed,
# configured, passing, and guarding nothing. Connecting it is its own change.
#
# Nothing here runs training, the fairness audit or the drift check. All three
# read data/*.csv -- 167 MB, gitignored on purpose -- so on a fresh checkout
# they cannot pass, and a permanently red job is a job people learn to ignore.
# The 340 tests are contract tests and need no dataset.
#
# ---------------------------------------------------------------------------
# WHAT THIS FILE DELIBERATELY DOES NOT RESTATE
#
# This repo's standing rule is that one fact lives in one place. A CI file is
# where that rule usually breaks, because it arrives as a fresh copy of every
# command, path and version in the project, and then drifts from the originals
# quietly. So each step below defers to the file that already holds the
# decision instead of repeating it:
#
#   Python version    -> .python-version (3.11), which uv reads on its own.
#                        NOT restated as a `python-version:` key, and no
#                        version matrix: this project is pinned to 3.11
#                        (requires-python, the README badge), so a matrix would
#                        spend most of its time proving things about versions
#                        the project never claimed to support.
#
#   Which paths ruff  -> pyproject.toml [tool.ruff] extend-exclude. That is why
#   checks               the step below is `ruff check .` and not a directory
#                        list: enumerating them here would put the notebooks/
#                        exclusion in a second place, free to disagree with the
#                        first.
#
#   Which groups get  -> pyproject.toml [tool.uv] default-groups. `uv sync
#   installed            --frozen` is what a developer runs; CI runs the same
#                        thing rather than a hand-tuned subset. All four jobs
#                        use that one command, including the frontend job,
#                        which needs far less -- see the note on its install
#                        step for why it is not trimmed anyway.
#
#   Node version      -> frontend/.nvmrc (24), which setup-node reads and so
#                        does a developer's `nvm use`. NOT restated as a
#                        `node-version:` key here, and deliberately not written
#                        as a package.json `engines` range: that would be a
#                        second copy of vite's own engines constraint, free to
#                        disagree with it as vite moves, and it would assert
#                        support for Node 20.19 -- vite's floor, never run
#                        against this frontend, and end-of-life since April
#                        2026. The line, not the patch, for the same reason
#                        .python-version says 3.11 and not 3.11.9.
#
#   MLflow telemetry  -> tests/conftest.py, which sets MLFLOW_DISABLE_TELEMETRY
#                        at module scope. Deliberately NOT set again here. It
#                        would be a second copy of the decision, and a harmful
#                        one: it would silence on CI a call that still leaves a
#                        laptop, turning a guard that fails loudly everywhere
#                        into one that only fails where nobody is looking.
#
# ---------------------------------------------------------------------------
# THE NETWORK GUARD IS LEFT FREE TO FIRE
#
# tests/conftest.py patches socket.connect and fails the run if the suite opens
# any outbound connection, recording violations from background threads that a
# raise alone would not catch. GitHub's runners have working egress, so if
# anything phones home the build goes red with the address, the thread and the
# first-party frame printed. That is the intended behaviour. No environment
# variable is set in this file to pre-empt it, and no step swallows its output.
# Verified green on a fresh clone before this file was written.
# ---------------------------------------------------------------------------

name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Least privilege: nothing here writes to the repository.
permissions:
  contents: read

# A second push to the same PR makes the first run's answer irrelevant. Cancel
# it rather than paying for an answer about a commit nobody will merge.
# `github.ref` on main is unique per branch, so pushes to main queue normally.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Four separate jobs, not four steps in one. A lint failure, a type failure,
  # a test failure and a frontend build failure are different kinds of problem,
  # and this repo keeps different gates visibly apart. Separate jobs run in
  # parallel and give the pull request four independent ticks, so a red one
  # names itself without anyone opening a log.
  #
  # The cost, stated: each job pays for its own checkout and dependency install.
  # That is accepted rather than worked around -- see the install note in the
  # mypy job for why a lighter install is not available to all three anyway.

  ruff:
    name: ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen

      # `ruff check .`, exactly as README's Setup section and pyproject record
      # it. Lint only: this repo does not run `ruff format`, and that decision
      # has a written argument in pyproject.toml's [tool.ruff] header. CI does
      # not get to reopen it by adding a `ruff format --check` step here.
      - name: Lint
        run: uv run --frozen ruff check .

  mypy:
    name: mypy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      # The full sync, including the training group, and that is not laziness.
      # Measured: with `--no-group training`, mypy reports 3 import-not-found
      # errors for mlflow (src/train.py, pipelines/training_flow.py,
      # pipelines/drift_check.py). mlflow is absent from the
      # ignore_missing_imports override list in pyproject.toml because it ships
      # real type information -- which only helps when it is installed.
      - name: Install dependencies
        run: uv sync --frozen

      # Target list copied from nowhere: it is the same string in README's
      # Setup section and in pyproject.toml's [tool.mypy] files key.
      - name: Type check
        run: uv run --frozen mypy src serving pipelines scripts

  pytest:
    name: pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen

      # The whole suite, with NO selection flags -- no -k, no -m, no
      # --deselect, no file path, no --lf. This is a hard constraint, not a
      # preference. tests/test_readme.py binds README's stated test count to the
      # live collection, and _run_is_narrowed() makes it SKIP ITSELF the moment
      # it detects any of those flags. Narrowing the run here would leave the
      # tick green while quietly retiring the invariant behind it, which is the
      # precise shape of unearned green this repo exists to refuse.
      #
      # -rs rather than -q, so the log carries two numbers a reader would
      # otherwise have to assume:
      #
      #   `collected 340 items` in the header -- proof the suite ran whole, and
      #   the same number test_readme.py checks README against.
      #
      #   every skip, with its reason. This matters on a fresh checkout:
      #   models/*.pkl is gitignored (regenerated by training, never committed),
      #   so 12 tests that load the shipped artifact skip here that pass on a
      #   developer's machine. A green tick alone would not say so. The log
      #   must, because "green" and "green with twelve tests that never ran"
      #   are different claims and only one of them is true here.
      - name: Test
        run: uv run --frozen pytest -rs

  # The frontend job needs BOTH toolchains, which is the one thing about it a
  # reader would not predict. `npm run build` fires package.json's `prebuild`,
  # which runs `gen:enums`, which is
  # `cd .. && uv run python frontend/scripts/generate-enums.py`. That script
  # imports serving.schema, src.data_validation and src.features to read the
  # real enum sets out of Python and write frontend/src/lib/enums.generated.ts,
  # so the dropdowns cannot drift from what the API will accept.
  #
  # So a Node-only job does not half-work here, it dies: measured on a clean
  # checkout with uv removed from PATH, `npm run build` exits 127 at prebuild
  # and never reaches tsc or vite -- no dist/ at all. Loud, which is the good
  # version of this. The Python install below is load-bearing, not incidental.
  frontend:
    name: frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          # The version lives in frontend/.nvmrc and is read from there, not
          # written again here. npm's cache keys off the lockfile, which is in
          # frontend/ rather than at the root, so the path has to be named.
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      # The same `uv sync --frozen` as the other three, and it installs far
      # more than this job uses: the generator's import chain bottoms out at
      # pydantic, pandas and pandera, all of them [project] dependencies, so
      # `--no-dev --no-group training` covers it -- measured, 36 packages
      # against 193.
      #
      # Not trimmed anyway, on purpose, and the reason is worth leaving here
      # because the trim looks free and is not. `uv run` re-syncs to
      # default-groups before it runs anything, and gen:enums calls plain
      # `uv run`. Measured: after a 36-package trimmed sync, one `uv run` puts
      # the environment back to 193. Making the trim stick needs UV_NO_SYNC=1
      # set alongside it, and those two must then stay paired forever -- delete
      # either half and the trim silently stops trimming. That is a mechanism
      # to maintain in exchange for seconds on a job whose environment is
      # discarded when it finishes. The serving image trims because its size
      # ships; this does not.
      - name: Install Python dependencies
        run: uv sync --frozen

      # `npm ci`, not `npm install`: it installs the lockfile exactly and fails
      # if package.json and package-lock.json disagree, rather than resolving
      # something new and quietly writing down what it chose.
      - name: Install Node dependencies
        working-directory: frontend
        run: npm ci

      # One command, two gates: `tsc -b` type checks and `vite build` bundles,
      # and either failing fails the step. Nothing here serves or previews the
      # result -- this job answers "does it still build", not "does it work".
      - name: Build
        working-directory: frontend
        run: npm run build
