<script>
async function buildPNG(scale = 2) {
  // XMLSerializer -> data: URL -> Image -> canvas -> toBlob.
  // The SVG carries its own <style> and uses no foreignObject, so the
  // serialized document is self-contained and rasterizes in any browser.
  const svg = document.getElementById('arch');
  const xml = new XMLSerializer().serializeToString(svg);
  const url = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(xml);
  const img = new Image();
  await new Promise((resolve, reject) => {
    img.onload = resolve;
    img.onerror = () => reject(new Error('SVG rasterization failed'));
    img.src = url;
  });
  const w = svg.viewBox.baseVal.width, h = svg.viewBox.baseVal.height;
  const canvas = document.createElement('canvas');
  canvas.width = w * scale;
  canvas.height = h * scale;
  const ctx = canvas.getContext('2d');
  ctx.fillStyle = '#0b0f14';                    // opaque background, not transparent
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
  const blob = await new Promise(res => canvas.toBlob(res, 'image/png'));
  if (!blob) throw new Error('canvas.toBlob returned null');
  return { blob, width: canvas.width, height: canvas.height };
}

document.getElementById('exportBtn').addEventListener('click', async () => {
  const btn = document.getElementById('exportBtn');
  try {
    btn.disabled = true;
    btn.textContent = 'Rendering…';
    const { blob } = await buildPNG(2);
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'trust-issues-architecture.png';
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 10000);
    btn.textContent = 'Export as PNG';
  } catch (e) {
    btn.textContent = 'Export failed: ' + e.message;
  } finally {
    btn.disabled = false;
  }
});

// Self-test hook: open with ?autotest — runs the exact export path
// (serialize -> rasterize -> canvas -> toBlob) minus the download click,
// and reports the outcome in document.title for headless verification.
if (location.search.includes('autotest')) {
  buildPNG(2)
    .then(r => { document.title = 'EXPORT_OK ' + r.width + 'x' + r.height + ' bytes=' + r.blob.size; })
    .catch(e => { document.title = 'EXPORT_FAIL ' + e.message; });
}
</script>
