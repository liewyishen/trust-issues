[project]
name = "trust-issues"
version = "0.1.0"
description = "A loan risk model that did the boring parts right."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    # serving/ imports fastapi, pydantic and uvicorn directly. Until now they
    # resolved only as TRANSITIVES of mlflow (uv.lock: fastapi:813,
    # pydantic:2989, starlette:3972, uvicorn:4183) -- installed, importable,
    # and undeclared. That is the same "declare what you import" defect commit
    # 341418f closed for the rest of this list: the day someone trims the ML
    # dependency, serving/ breaks at import time in production rather than in
    # CI. starlette is NOT declared here, because nothing in this repo imports
    # it; it is fastapi's own dependency and fastapi is responsible for it.
    #
    # Every entry below is a verified serving-time import: fastapi/pydantic/
    # uvicorn (the HTTP boundary), lightgbm (the booster), joblib (artifact
    # load), pandas (every frame), numpy (bureau.py/explain.py), scipy
    # (explain.py's scipy.special.expit), scikit-learn (IsotonicRegression,
    # plus model_io.py's module-level sklearn imports), pandera
    # (data_validation.py, reached transitively through serving/schema.py),
    # shap (explain.py's TreeExplainer). mlflow/metaflow/matplotlib/seaborn
    # are deliberately NOT here -- see the "training" dependency group below.
    #
    # Three of those four are genuinely unreachable from serving: mlflow,
    # metaflow and seaborn are absent from sys.modules after `import
    # serving.app`. matplotlib is NOT. serving reaches it transitively --
    # serving/artifacts.py imports lightgbm, and lightgbm's compat module
    # imports matplotlib on the way in. It stays out of this list anyway,
    # because lightgbm wraps that import in try/except ImportError (setting
    # MATPLOTLIB_INSTALLED = False and degrading to no plotting), so the slim
    # image TOLERATES matplotlib's absence rather than never asking for it.
    # Tolerated, not unreached. The runtime sys.modules check is what caught
    # the difference, and the difference is worth the extra sentence.
    "fastapi>=0.138.2",
    "joblib>=1.5.3",
    "lightgbm>=4.6.0",
    "numpy>=2.4.6",
    "pandas>=2.3.3",
    "pandera>=0.32.1",
    "pydantic>=2.13.4",
    "scikit-learn>=1.9.0",
    "scipy>=1.17.1",
    "shap>=0.49.1",
    "uvicorn>=0.49.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.uv]
# "training" is opt-out, not opt-in, by default: without this, a bare
# `uv sync` would prune mlflow/metaflow/matplotlib/seaborn from an existing
# environment the moment this group exists, silently breaking
# tests/test_train.py and tests/test_training_flow.py for anyone who runs
# `uv sync` out of habit rather than deliberately asking for the slim set.
# Keeping both groups default preserves "uv sync installs everything" for
# local/dev/CI-full use; the serving image is the one caller that opts OUT
# explicitly (--no-dev --no-group training), because that is the one place
# the distinction is supposed to matter.
default-groups = ["dev", "training"]

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
    "jupyter>=1.1.1",
    "pytest>=9.1.1",
]
# Training/notebook-only, verified against serving's actual import graph:
# pipelines/training_flow.py imports metaflow; src/train.py imports mlflow
# for its experiment-tracking orchestration; notebooks/analysis.ipynb imports
# matplotlib and seaborn.
#
# Not all four are absent from serving's import graph, and the honest split
# matters here. mlflow, metaflow and seaborn genuinely are: serving bottoms
# out at src/model_io.py, which does not import mlflow (see src/train.py's
# docstring), and none of the three appears in sys.modules after `import
# serving.app`. matplotlib DOES get imported on that path -- lightgbm's
# compat module imports it, and serving/artifacts.py imports lightgbm. It is
# still safe to leave out of the image, because that import is guarded
# (try/except ImportError -> MATPLOTLIB_INSTALLED = False), so lightgbm runs
# without it. So: three are never reached, one is reached and tolerated.
#
# The serving Docker image installs core dependencies only, via `uv sync
# --frozen --no-dev --no-group training --no-install-project`; local/dev/CI
# installs get this group by default (see [tool.uv] default-groups above).
training = [
    "matplotlib>=3.11.0",
    "metaflow>=2.19.35",
    "mlflow>=3.14.0",
    "seaborn>=0.13.2",
]
